<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chitarre · Andrea Rufo</title>
<meta name="description" content="Le mie chitarre.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f1ea; --fg:#141414; --muted:#6b675f; --line:#d9d4c7; --card:#fbf9f4; --accent:#d4341c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#f1ede4; --muted:#8d887d; --line:#2a2825; --card:#181715; --accent:#ff5a3c; } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.5 Inter, system-ui, sans-serif; padding:0 16px; }
  main { max-width:960px; margin:0 auto; padding:72px 0 96px; }
  h1 { font:400 clamp(64px,16vw,140px)/.9 Anton, Impact, sans-serif; text-transform:uppercase; letter-spacing:-.01em; }
  h1 span { color:var(--accent); }
  .sub { color:var(--muted); margin:16px 0 56px; }
  .grid { list-style:none; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-top:4px solid var(--fg); padding:20px 20px 18px; display:flex; flex-direction:column; gap:6px; position:relative; }
  .card:hover { border-top-color:var(--accent); }
  .since { position:absolute; top:16px; right:20px; font:400 22px/1 Anton, Impact, sans-serif; color:var(--accent); }
  .brand { font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding-right:64px; }
  .nick { font:400 40px/1 Anton, Impact, sans-serif; text-transform:uppercase; margin:2px 0 4px; }
  .model { font-weight:600; }
  .serial { align-self:flex-start; font:400 12px/1 "JetBrains Mono", ui-monospace, monospace; border:1px solid var(--line); padding:5px 7px; margin-top:6px; color:var(--muted); }
  .where { font-size:14px; color:var(--muted); }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px; border-top:1px solid var(--line); padding-top:10px; margin-top:8px; }
  dt { color:var(--muted); }
  footer { margin-top:56px; color:var(--muted); font-size:14px; }
  footer a { color:inherit; }
</style>
</head>
<body>
<main>
  <h1>Chitar<span>re</span></h1>
  <p class="sub" id="sub"></p>
  <ol class="grid" id="list"></ol>
  <footer><a href="https://rufo.dev">rufo.dev</a></footer>
</main>
<script>
// Aggiungi dettagli per chitarra in `specs` (chiave: valore), es. specs: { Pickup: "HH", Corde: "10-46" }
const guitars = [
  { brand: "EVH", nick: "Bumblebee", model: "Striped 151", since: 2023 },
  { brand: "Fender Squier", nick: "Blondy", model: "Telecaster", serial: "CSSL19002876", since: 2020 },
  { brand: "Sigma", nick: "Angel", model: "DR-28", since: 2018 },
  { brand: "Flight", nick: "Uku", model: "Soprano Ukulele", since: 2017 },
  { brand: "VGS", nick: "Lava", model: "Eruption", serial: "A10010226", since: 2014 },
  { brand: "Yamaha", nick: "Myung", model: "RBX774", since: 2013 },
  { brand: "Jackson", nick: "Katana", model: "Dinky", serial: "9802258", since: 2009 },
  { brand: "Fender", nick: "Nuvola", model: "Stratocaster Classic 60", serial: "MZ0209542", since: 2008 },
  { brand: "Yamaha", nick: "Skrap", model: "RGX", serial: "QN26157", since: 2005 },
  { brand: "Lenny Jackson", nick: "Diavoletto", model: "SG", since: 2001 },
  { brand: "Eko", nick: "Benny", model: "Range XII", since: 1997 },
  { brand: "Santana", nick: "Classy", model: "GG 20", since: 1993 },
  { brand: "PRS", nick: null, model: "SE Custom 24 CTA", serial: "C39862", since: 2021, where: "Aprile 2021 · YourMusic Roma" },
  { brand: "Jackson", nick: "Didi", model: "JS1X Dinky Minion", serial: "SWCWJ2343616", since: 2023, where: "Settembre 2023 · Thomann online" },
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
guitars.sort((a, b) => b.since - a.since);
document.getElementById("sub").textContent = `${guitars.length} strumenti, dal ${Math.min(...guitars.map(g => g.since))} a oggi.`;
document.getElementById("list").innerHTML = guitars.map(g => `
  <li class="card">
    <span class="since">${g.since}</span>
    <span class="brand">${esc(g.brand)}</span>
    <h2 class="nick">${esc(g.nick || g.model)}</h2>
    ${g.nick ? `<span class="model">${esc(g.model)}</span>` : ""}
    ${g.where ? `<span class="where">${esc(g.where)}</span>` : ""}
    ${g.serial ? `<code class="serial">S/N ${esc(g.serial)}</code>` : ""}
    ${g.specs ? `<dl>${Object.entries(g.specs).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
  </li>`).join("");
</script>
</body>
</html>
